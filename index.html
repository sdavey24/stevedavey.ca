<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031426">
  <title>Steve Davey</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #031426;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        #031426 url("steve-davey-hero.png")
        center center / contain no-repeat;
    }

    /* Clickable LinkedIn hotspot over the visible LinkedIn icon */
    .linkedin-link {
      position: absolute;
      left: 50%;
      top: 71.5%;
      width: clamp(44px, 4.5vw, 72px);
      height: clamp(44px, 4.5vw, 72px);
      transform: translate(-50%, -50%);
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .linkedin-link:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    @media (max-aspect-ratio: 3/2) {
      .hero {
        background-size: cover;
      }
    }
  </style>
</head>
<body>
  <main class="hero" aria-label="Steve Davey — Aviation, Technology, Projects">
    <a
      class="linkedin-link"
      href="https://www.linkedin.com/in/steve-davey-5822772b"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Steve Davey's LinkedIn profile"
      title="LinkedIn">
    </a>
  </main>
</body>
</html>
