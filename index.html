<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031426">
  <title>Steve Davey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #031426;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* The artwork itself is 3:2.
       Everything — including the LinkedIn button — is positioned
       relative to this artboard, NOT relative to the browser window. */
    .artboard {
      position: relative;
      width: min(100vw, calc(100vh * 1.5));
      width: min(100vw, calc(100svh * 1.5));
      aspect-ratio: 3 / 2;
      flex: 0 0 auto;

      background:
        #031426 url("steve-davey-bg.png")
        center center / 100% 100% no-repeat;
    }

    .linkedin {
      position: absolute;
      left: 50%;
      top: 75.1%;
      transform: translate(-50%, -50%);

      width: 3.2%;
      min-width: 34px;
      max-width: 50px;
      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12%;
      background: #0A66C2;
      box-shadow: 0 4px 14px rgba(0,0,0,.38);
      text-decoration: none;
      z-index: 10;

      transition: transform .18s ease, filter .18s ease;
    }

    .linkedin:hover {
      transform: translate(-50%, -54%);
      filter: brightness(1.08);
    }

    .linkedin:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .linkedin svg {
      width: 63%;
      height: 63%;
      fill: #fff;
    }

    /* Phone / portrait screens:
       keep the complete artwork together near the top instead of
       stretching the button into the empty area below it. */
    @media (max-aspect-ratio: 1 / 1) {
      body {
        align-items: flex-start;
        overflow-y: auto;
      }

      .artboard {
        width: 100vw;
        margin-top: max(0px, env(safe-area-inset-top));
      }

      .linkedin {
        width: 28px;
        min-width: 28px;
        max-width: 28px;
        top: 77.3%;
      }
    }
  </style>
</head>

<body>
  <main class="artboard" aria-label="Steve Davey — Aviation, Technology, Projects">
    <a
      class="linkedin"
      href="https://www.linkedin.com/in/steve-davey-5822772b"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Steve Davey on LinkedIn"
      title="LinkedIn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.1 20.45H3.54V9H7.1v11.45z"/>
      </svg>
    </a>
  </main>
</body>
</html>
