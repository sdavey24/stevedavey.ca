<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#031426">
  <title>Steve Davey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #031426;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        #031426 url("steve-davey-bg.png")
        center center / contain no-repeat;
    }

    /* Real HTML LinkedIn button positioned in the empty area
       below the location line, not baked into the image */
    .linkedin {
      position: absolute;
      left: 50%;
      top: 76.5%;
      transform: translate(-50%, -50%);
      width: clamp(44px, 3.8vw, 62px);
      height: clamp(44px, 3.8vw, 62px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #0A66C2;
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
      text-decoration: none;
      transition: transform .18s ease, filter .18s ease;
      z-index: 10;
    }

    .linkedin:hover {
      transform: translate(-50%, -54%);
      filter: brightness(1.08);
    }

    .linkedin:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    .linkedin svg {
      width: 62%;
      height: 62%;
      fill: #ffffff;
    }

    /* Keep the full artwork visible on narrower screens */
    @media (max-aspect-ratio: 16/10) {
      .page {
        background-size: contain;
      }

      .linkedin {
        top: 76%;
      }
    }

    @media (max-width: 700px) {
      html, body {
        overflow: auto;
      }

      .page {
        min-height: 100svh;
        background-size: contain;
        background-position: center top;
      }

      .linkedin {
        top: 74.5%;
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body>
  <main class="page" aria-label="Steve Davey — Aviation, Technology, Projects">

    <a
      class="linkedin"
      href="https://www.linkedin.com/in/steve-davey-5822772b"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Steve Davey on LinkedIn"
      title="LinkedIn">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.1 20.45H3.54V9H7.1v11.45z"/>
      </svg>

    </a>

  </main>
</body>
</html>
